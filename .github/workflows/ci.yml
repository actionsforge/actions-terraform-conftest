name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    uses: actionsforge/actions/.github/workflows/node-ci-workflow.yml@main
    with:
      node-version: '20'
      typecheck: true
      test-command: npm run test:run
      coverage: true
      build: true
      # Soft-fail audit lived in the old workflow (npm audit || true); deps still noisy
      audit: false
